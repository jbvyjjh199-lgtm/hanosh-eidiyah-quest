<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مهمة هنوش الكبرى 🎁</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
min-height:100vh;
background:
linear-gradient(135deg,#ff4f8d,#ff89b5,#ffd86f);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
overflow:hidden;
position:relative;
}

.bg{
position:absolute;
width:100%;
height:100%;
overflow:hidden;
z-index:0;
}

.circle{
position:absolute;
border-radius:50%;
background:rgba(255,255,255,.15);
animation:float 12s infinite linear;
}

.circle:nth-child(1){
width:200px;
height:200px;
top:10%;
left:5%;
}

.circle:nth-child(2){
width:300px;
height:300px;
bottom:5%;
right:5%;
animation-duration:15s;
}

.circle:nth-child(3){
width:120px;
height:120px;
bottom:20%;
left:20%;
animation-duration:9s;
}

@keyframes float{
0%{
transform:translateY(0) rotate(0deg);
}
50%{
transform:translateY(-30px) rotate(180deg);
}
100%{
transform:translateY(0) rotate(360deg);
}
}

.game{
position:relative;
z-index:1;
width:100%;
max-width:760px;
background:rgba(255,255,255,.18);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.25);
border-radius:35px;
padding:35px;
box-shadow:0 20px 50px rgba(0,0,0,.25);
text-align:center;
color:white;
}

.title{
font-size:48px;
font-weight:900;
margin-bottom:10px;
text-shadow:0 3px 10px rgba(0,0,0,.2);
}

.subtitle{
font-size:18px;
opacity:.95;
line-height:1.8;
margin-bottom:25px;
}

.progress{
height:18px;
background:rgba(255,255,255,.2);
border-radius:20px;
overflow:hidden;
margin-bottom:30px;
}

.bar{
height:100%;
width:0%;
background:linear-gradient(90deg,#fff,#ffe48f);
transition:.5s;
}

.question{
font-size:30px;
font-weight:700;
line-height:1.8;
margin-bottom:30px;
animation:fade .4s;
}

.answers{
display:grid;
gap:15px;
}

.answer{
padding:18px;
border:none;
border-radius:20px;
background:rgba(255,255,255,.18);
color:white;
font-size:20px;
font-weight:700;
cursor:pointer;
transition:.25s;
backdrop-filter:blur(5px);
border:1px solid rgba(255,255,255,.2);
}

.answer:hover{
transform:translateY(-3px) scale(1.02);
background:rgba(255,255,255,.28);
}

.money{
font-size:60px;
font-weight:900;
margin-top:30px;
color:#fff4b3;
text-shadow:0 3px 10px rgba(0,0,0,.2);
}

.message{
margin-top:18px;
font-size:22px;
font-weight:700;
min-height:40px;
}

.final{
font-size:34px;
line-height:2;
font-weight:900;
animation:pulse 1.2s infinite;
}

.restart{
margin-top:30px;
padding:18px 35px;
border:none;
border-radius:20px;
background:white;
color:#ff4f8d;
font-size:22px;
font-weight:900;
cursor:pointer;
transition:.3s;
}

.restart:hover{
transform:scale(1.05);
}

.spark{
position:absolute;
font-size:30px;
animation:up 4s linear infinite;
pointer-events:none;
}

@keyframes up{
0%{
transform:translateY(0) scale(.5);
opacity:0;
}
50%{
opacity:1;
}
100%{
transform:translateY(-900px) scale(1.4);
opacity:0;
}
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.04)}
100%{transform:scale(1)}
}

@keyframes fade{
from{
opacity:0;
transform:translateY(15px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@media(max-width:650px){

.title{
font-size:36px;
}

.question{
font-size:24px;
}

.answer{
font-size:18px;
}

.money{
font-size:45px;
}

}

</style>
</head>

<body>

<div class="bg">
<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>
</div>

<div class="game">

<div class="title">
مهمة هنوش الكبرى 🎁
</div>

<div class="subtitle">
كل قرار هيقربك من الجائزة الكبرى أو يضيعها منك 😈💖
</div>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<div id="content"></div>

</div>

<script>

const questionSets = [

[
{
q:"لقيتي زر مكتوب عليه (ممنوع الضغط) 🔴",
answers:[
{text:"أضغطه فورًا 😈",money:250,msg:"واضح إنك بتحبي المغامرة 🔥"},
{text:"مستحيل ألمسه 😭",money:50,msg:"الأمان حلو بس ضيعتي الإثارة 😂"}
]
},

{
q:"قدامك شنطتين 💼",
answers:[
{text:"الشنطة السودا 🖤",money:300,msg:"اختيار ذكي جدًا 💎"},
{text:"الشنطة القديمة 📦",money:100,msg:"فيها فلوس بس قليلة 😅"}
]
},

{
q:"الباب الأخير للكنز 🚪",
answers:[
{text:"ادخلي بسرعة ❤️",money:450,msg:"مبروووك قربتي من الجائزة الكبرى 🎉"},
{text:"استني شوية 👀",money:0,msg:"التردد ضيع الفرصة 😭"}
]
}
],

[
{
q:"فيه صندوق بيطلع صوت غريب 🎁",
answers:[
{text:"افتحيه 😎",money:250,msg:"طلع فيه مفاجأة جامدة 🔥"},
{text:"اهربي 😂",money:0,msg:"ضيعتي الكنز 😭"}
]
},

{
q:"اختاري بطاقة حظ 🍀",
answers:[
{text:"البطاقة الذهبية ✨",money:350,msg:"الحظ بيحبك 😎"},
{text:"البطاقة الرمادية 😅",money:100,msg:"جائزة بسيطة بس مقبولة 😂"}
]
},

{
q:"آخر خطوة قبل الفوز 👑",
answers:[
{text:"كملي للنهاية 💖",money:400,msg:"مبرووووك الفوز الكبير 🎉"},
{text:"خلاص كفاية 😭",money:50,msg:"كان فاضل خطوة واحدة 😂"}
]
}
]

];

let currentSet=[];
let current=0;
let total=0;

const content=document.getElementById("content");
const bar=document.getElementById("bar");

function randomGame(){

currentSet =
questionSets[
Math.floor(Math.random()*questionSets.length)
];

current=0;
total=0;

render();

}

function sparkles(){

for(let i=0;i<18;i++){

const s=document.createElement("div");

s.className="spark";

const arr=["💖","✨","🎉","💸"];

s.innerHTML=
arr[Math.floor(Math.random()*arr.length)];

s.style.left=Math.random()*100+"%";
s.style.bottom="-30px";

document.body.appendChild(s);

setTimeout(()=>{
s.remove();
},4000);

}

}

function render(){

bar.style.width=
`${(current/currentSet.length)*100}%`;

if(current>=currentSet.length){

content.innerHTML=`

<div class="money">
${total} جنيه 💸
</div>

<div class="final">
يا هنوش ❤️<br>
انتي خلصتي المهمة بنجاح 🎉<br>
ووصلتي للجائزة الكبرى
</div>

<button class="restart"
onclick="randomGame()">

إعادة اللعبة 🔄

</button>

`;

sparkles();

return;

}

const level=currentSet[current];

content.innerHTML=`

<div class="question">
${level.q}
</div>

<div class="answers">

${level.answers.map((a,i)=>`

<button class="answer"
onclick="choose(${i})">

${a.text}

</button>

`).join("")}

</div>

<div class="message" id="message"></div>

<div class="money">
${total} جنيه
</div>

`;

}

function choose(i){

const level=currentSet[current];

const answer=level.answers[i];

total+=answer.money;

document.getElementById("message")
.innerHTML=answer.msg;

document.querySelector(".money")
.innerHTML=`${total} جنيه 💸`;

sparkles();

document.querySelectorAll(".answer")
.forEach(btn=>{

btn.disabled=true;

btn.style.opacity=".6";

});

setTimeout(()=>{

current++;

render();

},1700);

}

randomGame();

</script>

</body>
</html>
