<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مغامرة هنوش 🎮</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:linear-gradient(135deg,#ff4f8d,#ff9ec4,#ffd76f);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:15px;
overflow:hidden;
}

.game{
width:100%;
max-width:700px;
background:rgba(255,255,255,.16);
backdrop-filter:blur(18px);
border-radius:35px;
padding:25px;
box-shadow:0 20px 60px rgba(0,0,0,.25);
color:white;
text-align:center;
position:relative;
overflow:hidden;
}

.title{
font-size:42px;
font-weight:900;
margin-bottom:10px;
}

.subtitle{
opacity:.9;
line-height:1.7;
margin-bottom:20px;
}

.stats{
display:flex;
justify-content:space-between;
gap:10px;
margin-bottom:20px;
}

.box{
flex:1;
background:rgba(255,255,255,.15);
padding:12px;
border-radius:18px;
font-weight:bold;
font-size:18px;
}

.grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;
margin-top:20px;
touch-action:none;
}

.cell{
aspect-ratio:1;
background:rgba(255,255,255,.12);
border-radius:18px;
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
transition:.25s;
}

.player{
background:#fff2a7 !important;
transform:scale(1.08);
}

.goal{
background:#5cffb2 !important;
animation:pulse 1s infinite;
}

.message{
margin-top:20px;
font-size:22px;
font-weight:bold;
min-height:40px;
}

.help{
margin-top:18px;
font-size:17px;
opacity:.9;
}

.restart{
margin-top:20px;
width:100%;
padding:18px;
border:none;
border-radius:20px;
background:white;
color:#ff4f8d;
font-size:22px;
font-weight:900;
cursor:pointer;
display:none;
}

.spark{
position:absolute;
font-size:30px;
animation:up 4s linear infinite;
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.08)}
100%{transform:scale(1)}
}

@keyframes up{
0%{
transform:translateY(0);
opacity:0;
}
50%{
opacity:1;
}
100%{
transform:translateY(-800px);
opacity:0;
}
}

</style>
</head>

<body>

<div class="game">

<div class="title">
مغامرة هنوش 🎮
</div>

<div class="subtitle">
اسحبي بإيدك على الشاشة عشان توصلي للكنز بدون فخاخ 😈💎
</div>

<div class="stats">

<div class="box">
المستوى: <span id="level">1</span>
</div>

<div class="box">
العيدية: <span id="money">0</span> 💸
</div>

</div>

<div class="grid" id="grid"></div>

<div class="message" id="message">
ابدأي السحب على الشاشة 😎
</div>

<div class="help">
⬅️➡️⬆️⬇️ اسحبي بإصبعك للتحرك
</div>

<button class="restart" id="restart"
onclick="startGame()">

إعادة اللعبة 🔄

</button>

</div>

<script>

const size=5;

let level=1;
let money=0;

let player={x:0,y:0};

let goal={x:4,y:4};

let traps=[];

const grid=document.getElementById("grid");

function rand(a,b){

return Math.floor(Math.random()*(b-a+1))+a;

}

function createLevel(){

traps=[];

for(let i=0;i<level+2;i++){

let tx=rand(0,4);
let ty=rand(0,4);

if(
(tx===0&&ty===0)||
(tx===4&&ty===4)
){
i--;
continue;
}

traps.push({x:tx,y:ty});

}

render();

}

function render(){

grid.innerHTML="";

for(let y=0;y<size;y++){

for(let x=0;x<size;x++){

const cell=document.createElement("div");

cell.className="cell";

if(player.x===x&&player.y===y){

cell.classList.add("player");
cell.innerHTML="😎";

}

else if(goal.x===x&&goal.y===y){

cell.classList.add("goal");
cell.innerHTML="💎";

}

else{

cell.innerHTML="";

}

grid.appendChild(cell);

}

}

}

function sparkles(){

for(let i=0;i<15;i++){

const s=document.createElement("div");

s.className="spark";

const arr=["✨","💖","💸","🎉"];

s.innerHTML=
arr[Math.floor(Math.random()*arr.length)];

s.style.left=Math.random()*100+"%";
s.style.bottom="-20px";

document.body.appendChild(s);

setTimeout(()=>{
s.remove();
},4000);

}

}

function move(dir){

if(dir==="up"&&player.y>0)
player.y--;

if(dir==="down"&&player.y<4)
player.y++;

if(dir==="left"&&player.x>0)
player.x--;

if(dir==="right"&&player.x<4)
player.x++;

check();

render();

}

function check(){

const trap=
traps.find(
t=>t.x===player.x&&t.y===player.y
);

if(trap){

document.getElementById("message")
.innerHTML=
"اوووبس 😭 وقعتي في فخ";

money=Math.max(0,money-100);

document.getElementById("money")
.innerHTML=money;

navigator.vibrate(200);

player={x:0,y:0};

return;

}

if(
player.x===goal.x&&
player.y===goal.y
){

money+=250;

document.getElementById("money")
.innerHTML=money;

document.getElementById("message")
.innerHTML=
`مبروك خلصتي المستوى ${level} 🎉`;

sparkles();

level++;

document.getElementById("level")
.innerHTML=level;

if(level>5){

win();
return;

}

player={x:0,y:0};

setTimeout(()=>{
createLevel();
},1200);

}

}

function win(){

document.getElementById("message")
.innerHTML=
`يا هنوش ❤️ كسبتي ${money} جنيه ووصلتي للكنز 💎`;

document.getElementById("restart")
.style.display="block";

sparkles();

}

function startGame(){

level=1;
money=0;

player={x:0,y:0};

document.getElementById("level")
.innerHTML=1;

document.getElementById("money")
.innerHTML=0;

document.getElementById("restart")
.style.display="none";

document.getElementById("message")
.innerHTML=
"ابدأي السحب على الشاشة 😎";

createLevel();

}

let startX=0;
let startY=0;

grid.addEventListener("touchstart",e=>{

startX=e.touches[0].clientX;
startY=e.touches[0].clientY;

});

grid.addEventListener("touchend",e=>{

let endX=e.changedTouches[0].clientX;
let endY=e.changedTouches[0].clientY;

let dx=endX-startX;
let dy=endY-startY;

if(Math.abs(dx)>Math.abs(dy)){

if(dx>30) move("right");
else if(dx<-30) move("left");

}else{

if(dy>30) move("down");
else if(dy<-30) move("up");

}

});

startGame();

</script>

</body>
</html>
