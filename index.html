<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مهمة هنوش الكبرى 🎁</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#ff4f8d,#ff89b5,#ffd86f);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
overflow:auto;
position:relative;
}

.game{
width:100%;
max-width:760px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(18px);
border-radius:35px;
padding:35px;
box-shadow:0 20px 50px rgba(0,0,0,.25);
position:relative;
overflow:hidden;
color:white;
border:1px solid rgba(255,255,255,.2);
}

.title{
font-size:48px;
font-weight:900;
text-align:center;
margin-bottom:10px;
}

.subtitle{
text-align:center;
font-size:18px;
line-height:1.7;
margin-bottom:25px;
opacity:.95;
}

.progress{
height:18px;
background:rgba(255,255,255,.15);
border-radius:20px;
overflow:hidden;
margin-bottom:30px;
}

.bar{
height:100%;
width:0%;
background:linear-gradient(90deg,#fff,#ffe98d);
transition:.5s;
}

.question{
font-size:30px;
font-weight:700;
line-height:1.8;
margin-bottom:25px;
text-align:center;
animation:fade .4s;
}

.answers{
display:grid;
gap:15px;
}

.answer{
padding:18px;
border:none;
border-radius:20px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(5px);
color:white;
font-size:20px;
font-weight:700;
cursor:pointer;
transition:.25s;
border:1px solid rgba(255,255,255,.2);
}

.answer:hover{
transform:translateY(-3px) scale(1.02);
background:rgba(255,255,255,.28);
}

.money{
font-size:55px;
font-weight:900;
text-align:center;
margin-top:25px;
color:#fff1a6;
}

.message{
margin-top:20px;
text-align:center;
font-size:23px;
font-weight:700;
min-height:45px;
}

.players{
margin-top:30px;
background:rgba(255,255,255,.12);
padding:20px;
border-radius:25px;
}

.players h3{
margin-bottom:15px;
text-align:center;
font-size:24px;
}

.log{
display:flex;
flex-direction:column;
gap:12px;
max-height:220px;
overflow:auto;
padding-right:5px;
}

.item{
background:rgba(255,255,255,.12);
padding:14px;
border-radius:15px;
line-height:1.7;
animation:fade .3s;
}

.correct{
border-right:5px solid #ffe066;
}

.wrong{
border-right:5px solid #ff8fa3;
}

.restart{
margin-top:30px;
width:100%;
padding:18px;
border:none;
border-radius:20px;
font-size:22px;
font-weight:900;
background:white;
color:#ff4f8d;
cursor:pointer;
transition:.3s;
}

.restart:hover{
transform:scale(1.03);
}

.final{
text-align:center;
font-size:34px;
font-weight:900;
line-height:2;
animation:pulse 1.2s infinite;
}

.spark{
position:absolute;
font-size:28px;
animation:up 4s linear infinite;
pointer-events:none;
}

@keyframes up{
0%{
transform:translateY(0) scale(.5);
opacity:0;
}
50%{
opacity:1;
}
100%{
transform:translateY(-900px) scale(1.4);
opacity:0;
}
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.04)}
100%{transform:scale(1)}
}

@keyframes fade{
from{
opacity:0;
transform:translateY(15px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@media(max-width:650px){

.title{
font-size:35px;
}

.question{
font-size:24px;
}

.answer{
font-size:18px;
}

.money{
font-size:42px;
}

}

</style>
</head>

<body>

<div class="game">

<div class="title">
مهمة هنوش الكبرى 🎁
</div>

<div class="subtitle">
كل اختيار هيزود الجائزة أو يضيعها 😈💖
</div>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<div id="content"></div>

<div class="players">

<h3>
سجل اختيارات هنوش 👀
</h3>

<div class="log" id="log"></div>

</div>

</div>

<script>

const questionSets=[

[
{
q:"قدامك 3 مفاتيح 🔑 أي واحد هيفتح الكنز؟",
answers:[
{text:"المفتاح الذهبي ✨",money:300,good:true,msg:"اختيار عبقري 🔥"},
{text:"المفتاح الأسود 🖤",money:50,good:false,msg:"طلع باب المخزن 😂"},
{text:"المفتاح الوردي 🎀",money:150,good:true,msg:"نص الحظ معاكي 😎"}
]
},

{
q:"في زر أحمر مكتوب عليه خطر 🔴",
answers:[
{text:"اضغطه فورًا 😈",money:350,good:true,msg:"طلعت جائزة سرية 💸"},
{text:"اهربي 😂",money:0,good:false,msg:"الكنز ضاع 😭"},
{text:"خلي حد يجرب 😅",money:100,good:false,msg:"حركة ذكية بس مش كفاية 😂"}
]
},

{
q:"آخر تحدي 👑",
answers:[
{text:"ادخلي الباب فورًا 🚪",money:350,good:true,msg:"مبرووووك الفوز الكبير 🎉"},
{text:"استني شوية 👀",money:50,good:false,msg:"التردد وحش 😭"},
{text:"ارجعي 😅",money:0,good:false,msg:"كان فاضل خطوة 😂"}
]
}
],

[
{
q:"لقيتي شنطة مليانة فلوس 💼",
answers:[
{text:"خديها واجري 😎",money:250,good:true,msg:"واضح إنك محترفة 😂"},
{text:"افتحيها بهدوء 👀",money:150,good:true,msg:"تصرف رايق 😄"},
{text:"سيبيها 😭",money:0,good:false,msg:"ليه بس 😂"}
]
},

{
q:"اختاري بطاقة الحظ 🍀",
answers:[
{text:"البطاقة الذهبية ⭐",money:400,good:true,msg:"جاكبوت 💸"},
{text:"البطاقة البيضاء 🤍",money:100,good:false,msg:"حظ متوسط 😅"},
{text:"البطاقة الغامضة 👀",money:250,good:true,msg:"اختيار جريء 🔥"}
]
},

{
q:"وصلتي للكنز الأخير 💎",
answers:[
{text:"افتحيه ❤️",money:350,good:true,msg:"الكنز طلع حقيقي 🎉"},
{text:"خايفة 😭",money:0,good:false,msg:"الكنز زعل منك 😂"},
{text:"خدي صورة الأول 📸",money:100,good:false,msg:"أهم حاجة المحتوى 😎"}
]
}

];

let currentSet=[];
let current=0;
let total=0;

const content=document.getElementById("content");
const bar=document.getElementById("bar");
const log=document.getElementById("log");

function randomGame(){

currentSet=
questionSets[
Math.floor(Math.random()*questionSets.length)
];

current=0;
total=0;

log.innerHTML="";

render();

}

function sparkles(){

for(let i=0;i<18;i++){

const s=document.createElement("div");

s.className="spark";

const arr=["💖","✨","💸","🎉"];

s.innerHTML=
arr[Math.floor(Math.random()*arr.length)];

s.style.left=Math.random()*100+"%";
s.style.bottom="-20px";

document.body.appendChild(s);

setTimeout(()=>{
s.remove();
},4000);

}

}

function render(){

bar.style.width=
`${(current/currentSet.length)*100}%`;

if(current>=currentSet.length){

content.innerHTML=`

<div class="money">
${total} جنيه 💸
</div>

<div class="final">
يا هنوش ❤️<br>
انتي كسبتي المهمة الكبرى 🎉
</div>

<button class="restart"
onclick="randomGame()">

إعادة اللعبة 🔄

</button>

`;

sparkles();

return;

}

const level=currentSet[current];

content.innerHTML=`

<div class="question">
${level.q}
</div>

<div class="answers">

${level.answers.map((a,i)=>`

<button class="answer"
onclick="choose(${i})">

${a.text}

</button>

`).join("")}

</div>

<div class="message" id="message"></div>

<div class="money">
${total} جنيه
</div>

`;

}

function choose(i){

const level=currentSet[current];

const answer=level.answers[i];

total+=answer.money;

document.getElementById("message")
.innerHTML=answer.msg;

document.querySelector(".money")
.innerHTML=
`${total} جنيه 💸`;

document.querySelectorAll(".answer")
.forEach(btn=>{

btn.disabled=true;
btn.style.opacity=".6";

});

const item=document.createElement("div");

item.className=
`item ${answer.good ? "correct":"wrong"}`;

item.innerHTML=
`<b>السؤال:</b> ${level.q}<br>
<b>اختيار هنوش:</b> ${answer.text}<br>
<b>النتيجة:</b> ${answer.msg}`;

log.prepend(item);

sparkles();

setTimeout(()=>{

current++;

render();

},1700);

}

randomGame();

</script>

</body>

</html>
