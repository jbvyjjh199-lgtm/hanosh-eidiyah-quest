<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مهمة هنوش السرية 🎁</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:linear-gradient(135deg,#ffb7d8,#ffe8a6);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
overflow:hidden;
}

.game{
width:100%;
max-width:750px;
background:white;
border-radius:35px;
padding:35px;
box-shadow:0 15px 40px rgba(0,0,0,.2);
text-align:center;
position:relative;
}

h1{
font-size:42px;
color:#ff3d82;
margin-bottom:10px;
}

.subtitle{
font-size:18px;
color:#666;
margin-bottom:25px;
line-height:1.6;
}

.level{
animation:fade .5s;
}

.challenge{
background:#fff2f7;
border:3px solid #ffc7da;
padding:25px;
border-radius:25px;
font-size:24px;
font-weight:bold;
color:#444;
margin-bottom:25px;
line-height:1.7;
}

.answers{
display:grid;
grid-template-columns:1fr;
gap:15px;
}

button{
border:none;
padding:18px;
border-radius:18px;
font-size:20px;
font-weight:bold;
cursor:pointer;
transition:.25s;
}

.answer{
background:#ffe0ec;
}

.answer:hover{
background:#ffc6db;
transform:scale(1.03);
}

.money{
font-size:55px;
font-weight:bold;
color:#00a651;
margin-top:25px;
}

.message{
margin-top:20px;
font-size:22px;
font-weight:bold;
min-height:50px;
color:#444;
}

.final{
font-size:32px;
line-height:1.8;
color:#ff3d82;
animation:pulse 1s infinite;
}

.progress{
height:18px;
background:#ffe3ee;
border-radius:20px;
overflow:hidden;
margin-bottom:25px;
}

.bar{
height:100%;
width:0%;
background:linear-gradient(90deg,#ff4f8d,#ff84b2);
transition:.5s;
}

.hearts{
position:absolute;
font-size:28px;
animation:float 4s linear infinite;
opacity:.7;
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.05)}
100%{transform:scale(1)}
}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@keyframes float{
0%{
transform:translateY(0);
opacity:0;
}
50%{
opacity:1;
}
100%{
transform:translateY(-800px);
opacity:0;
}
}

</style>
</head>

<body>

<div class="game">

<h1>مهمة هنوش السرية 🎁</h1>

<p class="subtitle">
كل اختيار هيحدد إذا كنتي هتوصلي للجائزة الكبرى ولا لا 😈💖
</p>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<div id="content"></div>

</div>

<script>

const levels = [

{
q:"لو لقيتي صندوق عليه مكتوب (ممنوع الفتح) هتعملي ايه؟ 👀",
answers:[
{text:"هفتحه طبعًا 😎",money:250,msg:"روح المغامرة دي تستحق مكافأة 🔥"},
{text:"هسيبه وامشي 😭",money:0,msg:"الكنوز مبتحبش الخوف 😂"}
]
},

{
q:"في زر أحمر قدامك 🔴",
answers:[
{text:"اضغطه فورًا 😈",money:250,msg:"واضح إنك بتحبي المخاطرة 😎"},
{text:"لا يمكن 😅",money:50,msg:"حذرة زيادة عن اللزوم 😂"}
]
},

{
q:"هنوش لقت خريطة كنز 🗺️",
answers:[
{text:"تروح تدور عليه 💎",money:250,msg:"مستوى الشجاعة ارتفع 🔥"},
{text:"تبيع الخريطة 😭",money:100,msg:"تفكير تجاري بس ضيعتي المغامرة 😂"}
]
},

{
q:"آخر باب قبل الجائزة الكبرى 🚪",
answers:[
{text:"ادخلي بدون تفكير ❤️",money:250,msg:"مبرووووك وصلتي للكنز 🎉"},
{text:"ارجعي تاني 😭",money:0,msg:"كان فاضل خطوة بس 😂"}
]
}

];

let current=0;
let total=0;

const content=document.getElementById("content");
const bar=document.getElementById("bar");

function hearts(){

for(let i=0;i<15;i++){

const h=document.createElement("div");

h.className="hearts";
h.innerHTML="💖";

h.style.left=Math.random()*100+"%";
h.style.bottom="-20px";

document.body.appendChild(h);

setTimeout(()=>{
h.remove();
},4000);

}

}

function render(){

bar.style.width=`${(current/levels.length)*100}%`;

if(current>=levels.length){

content.innerHTML=`

<div class="level">

<div class="money">
${total} جنيه 💸
</div>

<div class="final">
يا هنوش ❤️<br>
انتي خلصتي المهمة السرية بنجاح 🎉
<br>
ووصلتي للجائزة الكبرى
</div>

</div>

`;

hearts();

return;

}

const level=levels[current];

content.innerHTML=`

<div class="level">

<div class="challenge">
${level.q}
</div>

<div class="answers">

${level.answers.map((a,i)=>`

<button class="answer"
onclick="choose(${i})">

${a.text}

</button>

`).join("")}

</div>

<div class="message" id="message"></div>

<div class="money">
${total} جنيه
</div>

</div>

`;

}

function choose(i){

const level=levels[current];

const answer=level.answers[i];

total+=answer.money;

document.getElementById("message").innerHTML=
answer.msg;

document.querySelector(".money").innerHTML=
`${total} جنيه 💸`;

hearts();

document.querySelectorAll(".answer")
.forEach(btn=>{

btn.disabled=true;

});

setTimeout(()=>{

current++;

render();

},1800);

}

render();

</script>

</body>

</html>
