<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة عيدية هنوش 🎁</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:linear-gradient(135deg,#ffb6d9,#ffe7a3);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
padding:20px;
}

.game{
width:100%;
max-width:700px;
background:white;
padding:30px;
border-radius:35px;
box-shadow:0 15px 40px rgba(0,0,0,.2);
text-align:center;
position:relative;
}

h1{
font-size:42px;
color:#ff4081;
margin-bottom:10px;
}

.subtitle{
color:#666;
margin-bottom:25px;
font-size:18px;
}

.money{
font-size:50px;
font-weight:bold;
color:#00a651;
margin:20px 0;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
}

.card{
background:#fff0f6;
border:3px solid #ffc5d9;
border-radius:25px;
padding:30px 15px;
cursor:pointer;
transition:.25s;
font-size:22px;
font-weight:bold;
}

.card:hover{
transform:scale(1.05) rotate(1deg);
background:#ffdce9;
}

.message{
margin-top:25px;
font-size:22px;
font-weight:bold;
color:#444;
min-height:60px;
}

.next{
margin-top:20px;
background:#ff4f8d;
color:white;
border:none;
padding:15px 35px;
font-size:20px;
border-radius:20px;
cursor:pointer;
display:none;
}

.next:hover{
transform:scale(1.05);
}

.final{
font-size:30px;
line-height:1.8;
color:#ff4081;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.05)}
100%{transform:scale(1)}
}

.hearts{
position:absolute;
font-size:30px;
animation:float 4s linear infinite;
opacity:.7;
}

@keyframes float{
0%{
transform:translateY(0);
opacity:0;
}
50%{
opacity:1;
}
100%{
transform:translateY(-800px);
opacity:0;
}
}

@media(max-width:600px){

.grid{
grid-template-columns:1fr;
}

h1{
font-size:32px;
}

}

</style>
</head>

<body>

<div class="game">

<h1>لعبة عيدية هنوش 🎁</h1>

<p class="subtitle">
اختاري صح وكملي التحديات عشان توصلي للـ 1000 جنيه 💸
</p>

<div id="content"></div>

</div>

<script>

const levels = [

{
title:"اختاري الهدية الصح 🎀",
cards:[
{emoji:"🎁",win:100,msg:"بداية قوية +100 جنيه 😄"},
{emoji:"📦",win:0,msg:"بوكس فاضي 😂"},
{emoji:"💖",win:50,msg:"كيوت +50 جنيه"}
]
},

{
title:"فين الحظ؟ 🍀",
cards:[
{emoji:"⭐",win:200,msg:"نجمة الحظ +200 جنيه ✨"},
{emoji:"☁️",win:0,msg:"السحابة بلعت الجائزة 😭"},
{emoji:"🪙",win:100,msg:"لقيتي عملة ذهبية +100"}
]
},

{
title:"اختاري بسرعة 😈",
cards:[
{emoji:"🔥",win:300,msg:"ولعة معاكي +300 🔥"},
{emoji:"🧊",win:0,msg:"تلجت اللعبة 😂"},
{emoji:"🎯",win:150,msg:"إصابة ممتازة +150"}
]
},

{
title:"الجائزة الكبرى 👑",
cards:[
{emoji:"💎",win:400,msg:"مبرووووك الكنز الكبير 💎"},
{emoji:"🐸",win:0,msg:"ضفدعة بدل الفلوس 😭"},
{emoji:"👑",win:250,msg:"ملكة الحظ +250"}
]
}

];

let level=0;
let total=0;

const content=document.getElementById("content");

function hearts(){

for(let i=0;i<15;i++){

const h=document.createElement("div");

h.className="hearts";
h.innerHTML="💖";

h.style.left=Math.random()*100+"%";
h.style.bottom="-20px";
h.style.animationDuration=(Math.random()*2+3)+"s";

document.body.appendChild(h);

setTimeout(()=>{
h.remove();
},5000);

}

}

function render(){

if(level>=levels.length){

content.innerHTML=`

<div class="money">
${total} جنيه 💸
</div>

<div class="final">
يا هنوش انتي كسبتي اللعبة 🎉❤️
<br>
ووصلتي للجائزة الكبرى
</div>

<br>

<button class="next" style="display:inline-block"
onclick="location.reload()">
العبي تاني 😄
</button>

`;

hearts();

return;

}

const l=levels[level];

content.innerHTML=`

<h2 style="margin-bottom:20px;color:#444">
${l.title}
</h2>

<div class="grid">

${l.cards.map((c,i)=>`

<div class="card"
onclick="pick(${i})">

${c.emoji}

</div>

`).join("")}

</div>

<div class="message" id="message"></div>

<div class="money">
${total} جنيه
</div>

<button class="next" id="next"
onclick="nextLevel()">
المستوى اللي بعده 🚀
</button>

`;

}

function pick(i){

const current=levels[level];

const result=current.cards[i];

total+=result.win;

document.getElementById("message").innerHTML=result.msg;

document.querySelector(".money").innerHTML=
`${total} جنيه 💸`;

document.getElementById("next").style.display="inline-block";

if(result.win>0){
hearts();
}

document.querySelectorAll(".card").forEach(card=>{
card.style.pointerEvents="none";
});

}

function nextLevel(){

level++;

render();

}

render();

</script>

</body>
</html>
