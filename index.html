```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hanosh Treasure Quest</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:linear-gradient(135deg,#ffb6d5,#ffe9a8);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
overflow:hidden;
}

.container{
width:100%;
max-width:700px;
background:white;
padding:30px;
border-radius:30px;
box-shadow:0 15px 40px rgba(0,0,0,.2);
text-align:center;
position:relative;
}

h1{
font-size:40px;
color:#ff3d7f;
margin-bottom:10px;
}

.subtitle{
color:#666;
margin-bottom:25px;
font-size:18px;
}

.level{
display:none;
animation:fade .5s;
}

.active{
display:block;
}

button{
border:none;
padding:15px 25px;
border-radius:18px;
font-size:18px;
cursor:pointer;
transition:.3s;
margin:10px;
font-weight:bold;
}

.choice{
background:#fff0f6;
border:2px solid #ffb8cf;
width:100%;
}

.choice:hover{
transform:scale(1.03);
background:#ffd7e7;
}

.next{
background:#ff4d88;
color:white;
}

.next:hover{
transform:scale(1.05);
}

.money{
font-size:55px;
font-weight:bold;
color:#00a651;
margin:20px 0;
}

.final{
font-size:28px;
line-height:1.8;
color:#ff3d7f;
animation:pulse 1s infinite;
}

.hearts{
position:absolute;
font-size:25px;
animation:float 4s linear infinite;
opacity:.5;
}

@keyframes fade{
from{opacity:0;transform:translateY(20px)}
to{opacity:1;transform:translateY(0)}
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.05)}
100%{transform:scale(1)}
}

@keyframes float{
0%{
transform:translateY(0);
opacity:0;
}
50%{
opacity:.7;
}
100%{
transform:translateY(-800px);
opacity:0;
}
}
</style>
</head>

<body>

<div class="container">

<h1>رحلة كنز هنوش 🎁</h1>
<p class="subtitle">كل اختيار صح يقربك من الجائزة الكبرى 💖</p>

<div id="game"></div>

</div>

<script>

const levels = [

{
question:"لو معاكي مفتاحين أي باب تختاري؟ 🚪",
choices:[
{ text:"الباب الوردي 🎀", money:100, correct:true },
{ text:"الباب الغامض 👀", money:0, correct:false }
]
},

{
question:"في صندوقين قدامك 🎁",
choices:[
{ text:"الصندوق اللامع ✨", money:200, correct:true },
{ text:"الصندوق القديم 📦", money:50, correct:false }
]
},

{
question:"اختاري الحظ الصح 🍀",
choices:[
{ text:"نجمة الحظ ⭐", money:300, correct:true },
{ text:"ورقة الحظ 🍃", money:100, correct:false }
]
},

{
question:"آخر تحدي 😈 مين يستحق الجائزة الكبرى؟",
choices:[
{ text:"هنوش طبعًا ❤️", money:400, correct:true },
{ text:"مش هنوش 😒", money:0, correct:false }
]
}

];

let current = 0;
let total = 0;

const game = document.getElementById("game");

function createHearts(){
for(let i=0;i<20;i++){
const heart=document.createElement("div");
heart.className="hearts";
heart.innerHTML="💖";
heart.style.left=Math.random()*100+"%";
heart.style.bottom="-50px";
heart.style.animationDuration=(Math.random()*3+3)+"s";
document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},5000);
}
}

function renderLevel(){

if(current >= levels.length){

game.innerHTML = `
<div class="level active">

<div class="money">${total} جنيه 💸</div>

<div class="final">
مبروك يا هنوش ❤️<br>
وصلتي للكنز الكبير 🎉
</div>

<br>

<button class="next" onclick="location.reload()">
العبي تاني 😄
</button>

</div>
`;

createHearts();
return;
}

const level = levels[current];

game.innerHTML = `
<div class="level active">

<h2 style="margin-bottom:25px;color:#444">
${level.question}
</h2>

${level.choices.map(choice=>`
<button class="choice"
onclick='choose(${JSON.stringify(choice.money)}, "${choice.correct}")'>
${choice.text}
</button>
`).join("")}

<div class="money">${total} جنيه</div>

</div>
`;
}

function choose(money, correct){

total += money;

if(correct === "true"){
createHearts();
}

current++;

setTimeout(()=>{
renderLevel();
},500);
}

renderLevel();

</script>

</body>
</html>
```
