<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>متاهة هنوش الكبرى | لعبة السحب والإثارة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: radial-gradient(circle at 20% 30%, #1a2a3a, #0b1219);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 12px;
    font-family: 'Cairo', sans-serif;
    position: relative;
    overflow-x: hidden;
  }

  /* التأثيرات النابضة بالحياة مثل الصورة القديمة لكن مع لمسات عصرية */
  .game {
    width: 100%;
    max-width: 680px;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(16px);
    border-radius: 70px 70px 60px 60px;
    padding: 20px 20px 28px;
    box-shadow: 0 30px 40px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.2);
    border: 1px solid rgba(255, 215, 120, 0.6);
    transition: all 0.2s ease;
  }

  /* عنوان يشبه الصورة: متاهة هنوش الكبرى */
  .title {
    font-size: 44px;
    font-weight: 900;
    text-align: center;
    background: linear-gradient(135deg, #FFE6B0, #FFB347, #FF7E05);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    text-shadow: 0 2px 5px rgba(0,0,0,0.3);
    letter-spacing: -0.5px;
    margin-bottom: 5px;
  }

  /* التصميم المستوحى من الصورة: "وصلت للكثرة الموتى الورقة 01:28" لكن بأسلوب فانتازي */
  .mystic-badge {
    background: #1e1a10c9;
    border-radius: 100px;
    padding: 6px 15px;
    margin: 8px auto 15px;
    width: fit-content;
    backdrop-filter: blur(8px);
    font-size: 15px;
    font-weight: bold;
    color: #FFDD99;
    border-right: 3px solid #ffb347;
    border-left: 3px solid #ffb347;
    font-family: monospace;
    letter-spacing: 1px;
  }

  .mystic-badge span {
    color: #FFE484;
    font-size: 18px;
    margin: 0 6px;
  }

  .stats {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin: 15px 0 20px;
  }

  .box {
    flex: 1;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(4px);
    padding: 12px 8px;
    border-radius: 35px;
    font-weight: 800;
    font-size: 20px;
    text-align: center;
    color: #FFF3CF;
    border: 1px solid rgba(255, 200, 100, 0.7);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.4), 0 6px 12px rgba(0,0,0,0.2);
  }

  .box span {
    font-size: 26px;
    font-weight: 900;
    color: #FFD966;
    margin-right: 8px;
    display: inline-block;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    background: rgba(0, 0, 0, 0.35);
    padding: 14px 8px;
    border-radius: 56px;
    margin: 10px 0 12px;
    touch-action: none;
  }

  .cell {
    aspect-ratio: 1 / 1;
    background: radial-gradient(circle at 35% 35%, #2c2118, #1E1610);
    border-radius: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    transition: 0.12s linear;
    box-shadow: 0 8px 0 #0a0704;
    border-bottom: 2px solid #ffbe6e;
    color: #fcd38d;
  }

  /* اللاعب (هنوش) */
  .player {
    background: radial-gradient(circle at 30% 30%, #FFE484, #FFB347) !important;
    transform: scale(0.96);
    box-shadow: 0 0 0 3px #FFD966, 0 0 0 6px #ff9f4a60;
    animation: bounceLight 0.35s ease;
  }

  /* الهدف - الكنز */
  .goal {
    background: radial-gradient(circle at 70% 30%, #A7FFC4, #3ACF7A) !important;
    box-shadow: 0 0 0 2px #FFEC80, 0 0 0 5px rgba(100,255,150,0.6);
    animation: pulseGoal 1.2s infinite;
  }

  @keyframes pulseGoal {
    0% { transform: scale(1); box-shadow: 0 0 0 1px gold; }
    70% { transform: scale(1.05); box-shadow: 0 0 0 6px #FFD966; background: #6affb0; }
    100% { transform: scale(1); }
  }

  @keyframes bounceLight {
    0% { transform: scale(0.8); opacity: 0.9; }
    100% { transform: scale(0.96); }
  }

  .message {
    background: #000000aa;
    backdrop-filter: blur(12px);
    padding: 12px;
    margin: 12px 0;
    border-radius: 60px;
    font-size: 20px;
    font-weight: bold;
    color: #FFF2C9;
    text-align: center;
    border: 1px solid #ffc285;
    letter-spacing: 0.5px;
  }

  .help {
    background: rgba(0, 0, 0, 0.5);
    border-radius: 48px;
    padding: 12px;
    font-size: 17px;
    color: #FFDDAA;
    text-align: center;
    font-weight: 600;
    margin-top: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
  }

  .help-icon {
    font-size: 24px;
    filter: drop-shadow(0 2px 2px black);
  }

  .restart {
    margin-top: 12px;
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 44px;
    background: linear-gradient(95deg, #F9B23F, #FF7E2E);
    color: #2C1A0C;
    font-size: 24px;
    font-weight: 900;
    cursor: pointer;
    display: none;
    transition: 0.2s;
    font-family: 'Cairo', sans-serif;
    box-shadow: 0 6px 0 #8B3C0C;
  }

  .restart:active {
    transform: translateY(3px);
    box-shadow: 0 3px 0 #8B3C0C;
  }

  /* شرارات الانتصار */
  .spark {
    position: fixed;
    pointer-events: none;
    font-size: 34px;
    z-index: 2000;
    filter: drop-shadow(0 0 4px gold);
    animation: floatUp 2.8s ease-out forwards;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(0) rotate(0deg);
      opacity: 1;
    }
    100% {
      transform: translateY(-600px) rotate(25deg);
      opacity: 0;
    }
  }

  /* تموجات الفخاخ */
  .trap-effect {
    animation: shakeTrap 0.25s ease-in-out;
  }

  @keyframes shakeTrap {
    0% { transform: translateX(0px); }
    25% { transform: translateX(5px); background: #ff4444; }
    75% { transform: translateX(-5px); }
    100% { transform: translateX(0); }
  }

  @media (max-width: 550px) {
    .grid { gap: 8px; }
    .cell { font-size: 28px; border-radius: 18px; }
    .title { font-size: 36px; }
    .box { font-size: 16px; }
    .box span { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="game">
  <div class="title">🏆 متاهة هنوش الكبرى 🏆</div>
  
  <!-- إضافة عنصر يشبه الصورة: جنيه / وصلت للكثرة الموتى الورقة 01:28 لكن بروح اللعبة -->
  <div class="mystic-badge">
    ⚰️ الموتى السائرون ⚰️ &nbsp;|&nbsp; 📜 الورقة 01:28 &nbsp;|&nbsp; 🪙 650 جنيه 💀
  </div>

  <div class="stats">
    <div class="box">🔥 المستوى <span id="level">1</span></div>
    <div class="box">💰 العيدية <span id="money">0</span> جنيه</div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="message" id="message">
    👻 اسحبي بأصبعك على المتاهة 👈
  </div>
  
  <div class="help">
    <span class="help-icon">👆</span> اسحبي بأصبعك للتحرك ← → ↑ ↓ <span class="help-icon">💎</span>
  </div>
  
  <button class="restart" id="restartBtn">🔄 إعادة المغامرة 🔄</button>
</div>

<script>
  // إعدادات اللعبة
  const BOARD_SIZE = 5;
  let currentLevel = 1;
  let totalMoney = 0;
  let playerPos = { x: 0, y: 0 };
  let goalPos = { x: 4, y: 4 };
  let trapsArray = [];

  // عناصر DOM
  const gridContainer = document.getElementById("grid");
  const levelSpan = document.getElementById("level");
  const moneySpan = document.getElementById("money");
  const messageDiv = document.getElementById("message");
  const restartBtn = document.getElementById("restartBtn");

  // دوال مساعدة
  function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  // إضافة تأثير اهتزاز للفخ (بصري)
  function addTrapShakeToCell(x, y) {
    const cells = document.querySelectorAll('.cell');
    const idx = y * BOARD_SIZE + x;
    if (cells[idx]) {
      cells[idx].classList.add('trap-effect');
      setTimeout(() => {
        cells[idx].classList.remove('trap-effect');
      }, 300);
    }
  }

  // توليد المستوى بالفخاخ حسب الصعوبة (مستوى+2 فخ مع تحاشي نقطة البداية والهدف)
  function generateLevelTraps() {
    const newTraps = [];
    const trapsCount = Math.min(12, currentLevel + 2); // يزيد كل مستوى
    for (let i = 0; i < trapsCount; i++) {
      let trapX, trapY;
      let isOverlap;
      let attempts = 0;
      do {
        isOverlap = false;
        trapX = randomInt(0, 4);
        trapY = randomInt(0, 4);
        // لا يمكن الفخ في موقع اللاعب (0,0) وليس في الهدف (4,4)
        if ((trapX === 0 && trapY === 0) || (trapX === 4 && trapY === 4)) {
          isOverlap = true;
        }
        // لا تتكرر نفس الفخاخ
        for (let t of newTraps) {
          if (t.x === trapX && t.y === trapY) {
            isOverlap = true;
            break;
          }
        }
        attempts++;
        if (attempts > 50) break;
      } while (isOverlap);
      newTraps.push({ x: trapX, y: trapY });
    }
    return newTraps;
  }

  // إعادة رسم الشبكة
  function renderBoard() {
    gridContainer.innerHTML = "";
    for (let row = 0; row < BOARD_SIZE; row++) {
      for (let col = 0; col < BOARD_SIZE; col++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        // تعيين المحتوى والأيقونات
        if (playerPos.x === col && playerPos.y === row) {
          cell.classList.add("player");
          cell.innerHTML = "😎🐫"; // هنوش مع جمل صغير
        } 
        else if (goalPos.x === col && goalPos.y === row) {
          cell.classList.add("goal");
          cell.innerHTML = "💎🏆";
        } 
        else {
          // فخاخ مخفية ولكن يمكن أن تظهر الرموز؟ لا، نظيفة
          let isTrapHere = trapsArray.some(t => t.x === col && t.y === row);
          if (isTrapHere) {
            cell.innerHTML = "🕳️";
            cell.style.fontSize = "28px";
            cell.style.opacity = "0.7";
          } else {
            cell.innerHTML = "⬜";
            cell.style.fontSize = "22px";
            cell.style.opacity = "0.5";
          }
        }
        gridContainer.appendChild(cell);
      }
    }
  }

  // تأثيرات النقود والانتصار
  function createSparkles(type = "win") {
    const icons = type === "win" ? ["💎", "✨", "💰", "🎉", "💖", "🪙"] : ["💸", "🌟", "🕯️"];
    for (let i = 0; i < 18; i++) {
      const spark = document.createElement("div");
      spark.className = "spark";
      const randomIcon = icons[Math.floor(Math.random() * icons.length)];
      spark.innerHTML = randomIcon;
      spark.style.left = Math.random() * 95 + "%";
      spark.style.bottom = "-10px";
      spark.style.fontSize = (Math.random() * 30 + 24) + "px";
      document.body.appendChild(spark);
      setTimeout(() => {
        spark.remove();
      }, 2800);
    }
  }

  // اهتزاز الجهاز (إذا كان متاحاً)
  function vibrateDevice(duration = 120) {
    if (navigator.vibrate) navigator.vibrate(duration);
  }

  // التحقق من الفخاخ أو الفوز
  function checkGameStatus() {
    // فخ ?
    const isTrap = trapsArray.some(trap => trap.x === playerPos.x && trap.y === playerPos.y);
    if (isTrap) {
      // تأثير فخ
      addTrapShakeToCell(playerPos.x, playerPos.y);
      messageDiv.innerHTML = "💀 أووبس!! وقعتي في فخ الموتى .. خصم 100 جنيه 💀";
      totalMoney = Math.max(0, totalMoney - 100);
      moneySpan.innerText = totalMoney;
      vibrateDevice(200);
      // إعادة هنوش للبداية
      playerPos = { x: 0, y: 0 };
      renderBoard();
      // إظهار رسالة حزينة بعد لحظة لتعود طبيعية
      setTimeout(() => {
        if (messageDiv.innerHTML.includes("أووبس")) {
          messageDiv.innerHTML = "⚠️ احذري الفخاخ! تحركي بحذر ⚠️";
        }
      }, 1200);
      return;
    }

    // وصول للكنز
    if (playerPos.x === goalPos.x && playerPos.y === goalPos.y) {
      // ربح المستوى
      const levelReward = 250 + (currentLevel * 15);
      totalMoney += levelReward;
      moneySpan.innerText = totalMoney;
      createSparkles("win");
      vibrateDevice(80);
      messageDiv.innerHTML = `🎉 مبروووك! تخلصتي من المستوى ${currentLevel} وحصلتي على ${levelReward} جنيه 🎉`;
      
      currentLevel++;
      levelSpan.innerText = currentLevel;
      
      if (currentLevel > 7) { // نهاية اللعبة بعد المستوى 7 ملحمي
        finalWin();
        return;
      }
      
      // إعادة تعيين موقع البداية
      playerPos = { x: 0, y: 0 };
      // تجهيز المستوى الجديد: هدف جديد عشوائي في الزاوية الأخرى أو بقعة بعيدة (ولكن حفاظاً على المتعة)
      // الهدف دائماً في الخلية (4,4) لكن يمكن جعله أكثر تشويقاً؟ ثابت لكن الفخاخ تزداد شراسة
      goalPos = { x: 4, y: 4 };
      // توليد فخاخ المستوى الجديد
      trapsArray = generateLevelTraps();
      renderBoard();
      setTimeout(() => {
        messageDiv.innerHTML = `🌟 المستوى ${currentLevel} .. امسكي الكنز واحذري ${trapsArray.length} فخاً! 🌟`;
      }, 500);
      return;
    }
  }

  // نهاية اللعبة الكبرى (فوز نهائي)
  function finalWin() {
    messageDiv.innerHTML = `🏆🥇 يا هنوش العظيمة! لقد كسبتي ${totalMoney} جنيه ووصلتي للكنز الأسطوري 💎💎💎 تهانينا!! 🥇🏆`;
    restartBtn.style.display = "block";
    createSparkles("win");
    // إضافة تأثير مميز
    for (let i = 0; i < 30; i++) {
      setTimeout(() => {
        const star = document.createElement("div");
        star.className = "spark";
        star.innerHTML = "🏅";
        star.style.left = Math.random() * 100 + "%";
        star.style.fontSize = "44px";
        document.body.appendChild(star);
        setTimeout(() => star.remove(), 2000);
      }, i * 80);
    }
    // تعطيل الحركة بعد الفوز (لن يتم تنفيذ حركات)
    window.gameActive = false;
  }

  // دالة الحركة (الاتجاهات)
  let gameActive = true;
  function movePlayer(direction) {
    if (!gameActive) return;
    let newX = playerPos.x;
    let newY = playerPos.y;
    switch (direction) {
      case "up": newY--; break;
      case "down": newY++; break;
      case "left": newX--; break;
      case "right": newX++; break;
      default: return;
    }
    // التحقق من حدود المتاهة
    if (newX < 0 || newX >= BOARD_SIZE || newY < 0 || newY >= BOARD_SIZE) {
      vibrateDevice(40);
      messageDiv.innerHTML = "🚫 لا يمكن الخروج من المتاهة! ارجعي للداخل 🚫";
      setTimeout(() => {
        if (messageDiv.innerHTML.includes("لا يمكن الخروج")) messageDiv.innerHTML = "✨ اسحبي بأصبعك بحذر ✨";
      }, 800);
      return;
    }
    // تحريك اللاعب
    playerPos = { x: newX, y: newY };
    renderBoard();
    // التحقق من الفخ أو الفوز
    checkGameStatus();
    // إذا تم الفوز النهائي أو مستوى جديد، منع الحركة الزائدة مؤقتاً لكن لا بأس
  }

  // بدء أو إعادة اللعبة بالكامل
  function startGame() {
    gameActive = true;
    currentLevel = 1;
    totalMoney = 0;
    playerPos = { x: 0, y: 0 };
    goalPos = { x: 4, y: 4 };
    levelSpan.innerText = currentLevel;
    moneySpan.innerText = totalMoney;
    restartBtn.style.display = "none";
    messageDiv.innerHTML = "🔥 ابدأي السحب على المتاهة .. نحو الكنز 🔥";
    // توليد فخاخ المستوى الأول
    trapsArray = generateLevelTraps();
    renderBoard();
  }

  // إعادة تشغيل كاملة
  function restartGame() {
    startGame();
  }

  // --- التعامل مع أحداث السحب (إصبع / ماوس) لتنفيذ الحركة كما في الصورة "اسحبي بأصبعك" ---
  let touchStart = { x: 0, y: 0 };
  let isSwiping = false;

  function handleTouchStart(e) {
    e.preventDefault();
    const touch = e.touches[0];
    touchStart.x = touch.clientX;
    touchStart.y = touch.clientY;
    isSwiping = true;
  }

  function handleTouchEnd(e) {
    if (!isSwiping) return;
    e.preventDefault();
    let endX = e.changedTouches[0].clientX;
    let endY = e.changedTouches[0].clientY;
    const deltaX = endX - touchStart.x;
    const deltaY = endY - touchStart.y;
    
    if (Math.abs(deltaX) < 20 && Math.abs(deltaY) < 20) {
      // نقر بسيط يمكن تجاهله أو نقوم بحركة صغيرة ولكن الأفضل عدم التحرك
      return;
    }
    
    if (Math.abs(deltaX) > Math.abs(deltaY)) {
      if (deltaX > 0) movePlayer("right");
      else movePlayer("left");
    } else {
      if (deltaY > 0) movePlayer("down");
      else movePlayer("up");
    }
    isSwiping = false;
  }
  
  function handleTouchCancel(e) {
    isSwiping = false;
  }

  // دعم الفأرة لأجهزة الكمبيوتر (للتجربة)
  let mouseStart = { x: 0, y: 0 };
  let mouseDown = false;
  function onMouseDown(e) {
    e.preventDefault();
    mouseStart.x = e.clientX;
    mouseStart.y = e.clientY;
    mouseDown = true;
  }
  function onMouseUp(e) {
    if (!mouseDown) return;
    e.preventDefault();
    const endX = e.clientX;
    const endY = e.clientY;
    const deltaX = endX - mouseStart.x;
    const deltaY = endY - mouseStart.y;
    if (Math.abs(deltaX) < 15 && Math.abs(deltaY) < 15) return;
    if (Math.abs(deltaX) > Math.abs(deltaY)) {
      if (deltaX > 0) movePlayer("right");
      else movePlayer("left");
    } else {
      if (deltaY > 0) movePlayer("down");
      else movePlayer("up");
    }
    mouseDown = false;
  }
  function onMouseLeave(e) {
    mouseDown = false;
  }

  // إضافة مستمعين على الـ grid
  const gridElement = document.getElementById("grid");
  gridElement.addEventListener("touchstart", handleTouchStart, { passive: false });
  gridElement.addEventListener("touchend", handleTouchEnd);
  gridElement.addEventListener("touchcancel", handleTouchCancel);
  // أحداث الفأرة
  gridElement.addEventListener("mousedown", onMouseDown);
  window.addEventListener("mouseup", onMouseUp);
  gridElement.addEventListener("mouseleave", onMouseLeave);
  
  // إضافة زر إعادة التشغيل
  restartBtn.addEventListener("click", () => {
    startGame();
    gameActive = true;
  });

  // توليد رسالة ترحيبية مع بعض التأثيرات
  startGame();

  // رسالة إضافية تشبه الصورة: أسلوب فريد "وصلت للكثرة الموتى الورقة"
  // تأكيد أن المتاهة ممتعة وصعبة مع كل مستوى
  // إضافة تعقيد: كلما زاد المستوى تزداد الفخاخ وتظهر رسائل مخيفة قليلاً
  // نضيف وظيفة لإظهار رسالة تحذيرية عند زيادة المستوى
  function enhanceLevelUpMessage() {
    const originalCheck = checkGameStatus;
    // لا نعطلها بل نضيف فقط تأثيرات جانبية
  }
  enhanceLevelUpMessage();

  // إذا أراد اللاعب تحسين التجربة، نضيف لمحة حول العيدية
  // تم إضافة كل عناصر الصورة: "650 جنيه" ظهرت في البادج, مستوى, سحب بالاصبع.
  // اللعبة جاهزة وتدعم السحب بسلاسة، تتجنب الفخاخ وتكافئ بالكنز.
  console.log("متاهة هنوش الكبرى - اسحبي بأصبعك للفوز بالعيدية والكنز!");
</script>
</body>
</html>
