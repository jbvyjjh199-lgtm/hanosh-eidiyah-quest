<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>متاهة هنوش الكبرى 🎮</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:linear-gradient(135deg,#ff4f8d,#ff89b5,#ffd86f);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
overflow:hidden;
}

.game{
width:100%;
max-width:850px;
background:rgba(255,255,255,.14);
backdrop-filter:blur(18px);
border-radius:35px;
padding:30px;
box-shadow:0 20px 60px rgba(0,0,0,.25);
color:white;
position:relative;
overflow:hidden;
}

.title{
text-align:center;
font-size:45px;
font-weight:900;
margin-bottom:10px;
}

.subtitle{
text-align:center;
opacity:.9;
margin-bottom:20px;
font-size:18px;
line-height:1.7;
}

.info{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
gap:15px;
flex-wrap:wrap;
}

.box{
background:rgba(255,255,255,.15);
padding:12px 20px;
border-radius:18px;
font-size:20px;
font-weight:700;
}

.grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;
margin-top:20px;
}

.cell{
aspect-ratio:1;
border-radius:18px;
display:flex;
justify-content:center;
align-items:center;
font-size:30px;
font-weight:bold;
background:rgba(255,255,255,.1);
transition:.25s;
}

.player{
background:#fff3a6 !important;
color:#ff4f8d;
transform:scale(1.08);
box-shadow:0 0 20px rgba(255,255,255,.7);
}

.goal{
background:#6dffb3 !important;
color:#004d28;
animation:pulse 1s infinite;
}

.trap{
background:#ff8da1 !important;
}

.controls{
display:grid;
grid-template-columns:repeat(3,80px);
justify-content:center;
gap:12px;
margin-top:30px;
}

.btn{
height:75px;
border:none;
border-radius:22px;
background:rgba(255,255,255,.18);
color:white;
font-size:28px;
cursor:pointer;
transition:.2s;
backdrop-filter:blur(5px);
}

.btn:hover{
transform:scale(1.08);
background:rgba(255,255,255,.3);
}

.message{
margin-top:25px;
text-align:center;
font-size:24px;
font-weight:700;
min-height:40px;
}

.restart{
margin-top:20px;
width:100%;
padding:18px;
border:none;
border-radius:22px;
background:white;
color:#ff4f8d;
font-size:22px;
font-weight:900;
cursor:pointer;
display:none;
}

.spark{
position:absolute;
font-size:28px;
animation:up 4s linear infinite;
pointer-events:none;
}

@keyframes up{
0%{
transform:translateY(0) scale(.5);
opacity:0;
}
50%{
opacity:1;
}
100%{
transform:translateY(-900px) scale(1.4);
opacity:0;
}
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.08)}
100%{transform:scale(1)}
}

@media(max-width:700px){

.grid{
grid-template-columns:repeat(5,1fr);
}

.controls{
grid-template-columns:repeat(3,70px);
}

.btn{
height:65px;
font-size:24px;
}

.title{
font-size:35px;
}

}

</style>
</head>

<body>

<div class="game">

<div class="title">
متاهة هنوش الكبرى 🎮
</div>

<div class="subtitle">
وصلي للكنز 💎 بدون ما تقعي في الفخاخ 😈
</div>

<div class="info">

<div class="box">
المستوى: <span id="level">1</span>
</div>

<div class="box">
العيدية: <span id="money">0</span> جنيه 💸
</div>

</div>

<div class="grid" id="grid"></div>

<div class="controls">

<div></div>

<button class="btn" onclick="move('up')">
⬆️
</button>

<div></div>

<button class="btn" onclick="move('left')">
⬅️
</button>

<button class="btn" onclick="move('down')">
⬇️
</button>

<button class="btn" onclick="move('right')">
➡️
</button>

</div>

<div class="message" id="message">
ابدأي المهمة 😎
</div>

<button class="restart" id="restart"
onclick="startGame()">

إعادة اللعبة 🔄

</button>

</div>

<script>

const size=5;

let level=1;
let money=0;

let player={x:0,y:0};

let goal={x:4,y:4};

let traps=[];

const grid=document.getElementById("grid");

function random(min,max){

return Math.floor(
Math.random()*(max-min+1)
)+min;

}

function createLevel(){

traps=[];

for(let i=0;i<level+2;i++){

let tx=random(0,4);
let ty=random(0,4);

if(
(tx===0&&ty===0)||
(tx===4&&ty===4)
){

i--;
continue;

}

traps.push({x:tx,y:ty});

}

render();

}

function render(){

grid.innerHTML="";

for(let y=0;y<size;y++){

for(let x=0;x<size;x++){

const cell=document.createElement("div");

cell.className="cell";

if(player.x===x&&player.y===y){

cell.classList.add("player");
cell.innerHTML="😎";

}

else if(goal.x===x&&goal.y===y){

cell.classList.add("goal");
cell.innerHTML="💎";

}

else if(
traps.some(t=>t.x===x&&t.y===y)
){

cell.innerHTML="❓";

}

else{

cell.innerHTML="";

}

grid.appendChild(cell);

}

}

}

function sparkles(){

for(let i=0;i<18;i++){

const s=document.createElement("div");

s.className="spark";

const arr=["💖","✨","💸","🎉"];

s.innerHTML=
arr[Math.floor(Math.random()*arr.length)];

s.style.left=Math.random()*100+"%";
s.style.bottom="-20px";

document.body.appendChild(s);

setTimeout(()=>{
s.remove();
},4000);

}

}

function move(dir){

if(dir==="up"&&player.y>0)
player.y--;

if(dir==="down"&&player.y<4)
player.y++;

if(dir==="left"&&player.x>0)
player.x--;

if(dir==="right"&&player.x<4)
player.x++;

check();

render();

}

function check(){

const trap=
traps.find(
t=>t.x===player.x&&t.y===player.y
);

if(trap){

document.getElementById("message")
.innerHTML=
"وقعتي في الفخ 😭";

money=Math.max(0,money-100);

document.getElementById("money")
.innerHTML=money;

player={x:0,y:0};

return;

}

if(
player.x===goal.x&&
player.y===goal.y
){

money+=250;

document.getElementById("money")
.innerHTML=money;

document.getElementById("message")
.innerHTML=
`مبرووووك خلصتي المستوى ${level} 🎉`;

sparkles();

level++;

document.getElementById("level")
.innerHTML=level;

if(level>5){

winGame();
return;

}

player={x:0,y:0};

setTimeout(()=>{
createLevel();
},1200);

}

}

function winGame(){

document.getElementById("message")
.innerHTML=
`يا هنوش ❤️ كسبتي ${money} جنيه ووصلتي للكنز الكبير 🎁`;

document.getElementById("restart")
.style.display="block";

sparkles();

}

function startGame(){

level=1;
money=0;

player={x:0,y:0};

document.getElementById("level")
.innerHTML=level;

document.getElementById("money")
.innerHTML=money;

document.getElementById("restart")
.style.display="none";

document.getElementById("message")
.innerHTML=
"ابدأي المهمة 😎";

createLevel();

}

startGame();

</script>

</body>

</html>
